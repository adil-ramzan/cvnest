# Verification only. This workflow never deploys: it has no Cloudflare credentials,
# runs no wrangler or opennextjs-cloudflare command, and only reads the repository.
# Deployment stays as documented in docs/deploy-cloudflare.md.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the long PDF and pagination suites (Chrome and Firefox, about 40 minutes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  browser:
    name: Browser suites (Chrome)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run build
      # The fast suites: editing, data safety, security, accessibility and layout.
      # "zoom.test" matches only the Chrome zoom suite, not zoom-firefox.
      - run: >-
          npm run test:e2e --
          a11y count customize data-model editor entries error-boundaries fields guard keyboard
          layout links open-section safety sample security template-picker templates zoom.test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: .e2e-output/
          retention-days: 7

  pdf:
    name: PDF and pagination suites (Chrome and Firefox)
    if: github.event_name == 'workflow_dispatch' && inputs.full
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run build
      - run: npm run test:e2e -- pdf pagination bullets zoom-firefox
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pdf-output
          path: .e2e-output/
          retention-days: 7
